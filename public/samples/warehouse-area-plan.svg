  <path d="M69 655H1131" stroke="#dce3ed"/>
  <rect x="77" y="679" width="18" height="14" rx="3" fill="#edf3ff" stroke="#9eb7de"/>
  <text x="108" y="692" fill="#64748b" font-size="15">Illustrative work zones</text>
  <text x="468" y="692" fill="#64748b" font-size="15">Fictional demo plan · Not to scale · Manual area mapping</text>
  <text x="77" y="724" fill="#94a3b8" font-size="13">Area locations are demonstration references. No quantities, completion or claim values are measured from this drawing.</text>
