<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="plan-title plan-description">
  <title id="plan-title">Fictional warehouse area plan</title>
  <desc id="plan-description">A fictional warehouse site plan for manual area mapping. Block A contains the external-wall zone A1 and roof zone A2. Block B contains floor zone B1 and loading-bay zone B2. This diagram is not to scale and has no measured dimensions.</desc>
  <defs>
    <pattern id="roof-lines" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 16 16 0" stroke="#d7e2f3" stroke-width="1"/>
    </pattern>
    <pattern id="floor-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e3e9f1" stroke-width="1"/>
    </pattern>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .caption { fill: #64748b; font-size: 15px; }
      .zone-label { fill: #334155; font-size: 17px; font-weight: 600; }
      .site-line { fill: none; stroke: #b9c6d8; stroke-width: 2; }
      .wall { fill: none; stroke: #8fa1ba; stroke-width: 5; }
      .internal { fill: none; stroke: #c5d0de; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="54" y="58" fill="#1e293b" font-size="30" font-weight="600">Warehouse area plan</text>
