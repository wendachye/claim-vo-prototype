    <text x="0" y="0" text-anchor="middle" fill="#64748b" font-size="13" font-weight="600">N</text>
    <path d="M0 13-9 37H0V58M0 13 9 37H0" fill="#d7e2f1" stroke="#8da2bf" stroke-width="2"/>
